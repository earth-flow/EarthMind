version: "3.8"

services:
  earthmind:
    image: earthmindai/earthmind:1.0-alpha
    ports:
      - "7860:7860"
    depends_on:
      - postgres
    environment:
      - EARTHMIND_DATABASE_URL=postgresql://earthmind:earthmind@postgres:5432/earthmind
      # This variable defines where the logs, file storage, monitor data and secret keys are stored.
      - EARTHMIND_CONFIG_DIR=app/earthmind
    volumes:
      - earthmind-data:/app/earthmind

  postgres:
    # Pinned to a specific Debian base (trixie) so the postgres:16 tag does not
    # silently roll its OS underneath us — that roll causes a glibc collation
    # version mismatch warning on existing volumes. Matches the earthmind image
    # base. See https://github.com/earthmind-ai/earthmind/issues/9608
    image: postgres:16-trixie
    environment:
      POSTGRES_USER: earthmind
      POSTGRES_PASSWORD: earthmind
      POSTGRES_DB: earthmind
    ports:
      - "5432:5432"
    volumes:
      - earthmind-postgres:/var/lib/postgresql/data

volumes:
  earthmind-postgres:
  earthmind-data:
