version: "3.8"

services:
  terraflow:
    image: terraflowai/terraflow:1.0-alpha
    ports:
      - "7860:7860"
    depends_on:
      - postgres
    environment:
      - TERRAFLOW_DATABASE_URL=postgresql://terraflow:terraflow@postgres:5432/terraflow
      # This variable defines where the logs, file storage, monitor data and secret keys are stored.
      - TERRAFLOW_CONFIG_DIR=app/terraflow
    volumes:
      - terraflow-data:/app/terraflow

  postgres:
    # Pinned to a specific Debian base (trixie) so the postgres:16 tag does not
    # silently roll its OS underneath us — that roll causes a glibc collation
    # version mismatch warning on existing volumes. Matches the terraflow image
    # base. See https://github.com/terraflow-ai/terraflow/issues/9608
    image: postgres:16-trixie
    environment:
      POSTGRES_USER: terraflow
      POSTGRES_PASSWORD: terraflow
      POSTGRES_DB: terraflow
    ports:
      - "5432:5432"
    volumes:
      - terraflow-postgres:/var/lib/postgresql/data

volumes:
  terraflow-postgres:
  terraflow-data:
