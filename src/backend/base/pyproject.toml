[tool.uv]
override-dependencies = [
    "litellm>=1.85.1,<2.0.0"
]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "pytest-github-actions-annotate-failures>=0.2.0",
    "ipykernel>=6.29.0",
    "ruff>=0.12.7",
    "httpx[http2]>=0.27",
    "pytest>=9.0.3",
    "requests>=2.33.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "pytest-xdist>=3.6.0",
    "pytest-sugar>=1.0.0",
    "respx>=0.21.1",
    "pytest-instafail>=0.5.0",
    "pytest-asyncio>=0.23.0",
    "pytest-profiling>=1.7.0",
    "pre-commit>=3.7.0",
    "vulture>=2.11",
    "dictdiffer>=0.9.0",
    "pytest-split>=0.9.0",
    "devtools>=0.12.2",
    "pytest-flakefinder>=1.1.0",
    "types-markdown>=3.7.0.20240822",
    "codeflash>=0.8.4",
    "fakeredis>=2.0.0",
]


[tool.hatch.build.targets.wheel]
packages = ["terraflow"]


[tool.pytest.ini_options]
minversion = "6.0"
#addopts = "-ra"
testpaths = ["tests", "integration"]
console_output_style = "progress"
filterwarnings = ["ignore::DeprecationWarning"]
log_cli = true
markers = ["async_test"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.codeflash]
# All paths are relative to this pyproject.toml's directory.
module-root = "terraflow"
tests-root = "../tests/unit"
test-framework = "pytest"
ignore-paths = ["terraflow/components/"]
formatter-cmds = ["ruff check --exit-zero --fix $file", "ruff format $file"]
# disable plugins that might interfere with runtime measurement
pytest-cmd = "pytest -p no:profiling -p no:sugar -p no:xdist -p no:cov -p no:split"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.urls]
Repository = "https://github.com/terraflow-ai/terraflow"
Documentation = "https://docs.terraflow.org"
# Optional dependencies
[project.optional-dependencies]
audio = [
    "webrtcvad>=2.0.10",
]

postgresql = [
    "sqlalchemy[postgresql_psycopg2binary]>=2.0.38,<3.0.0",
    "sqlalchemy[postgresql_psycopg]>=2.0.38,<3.0.0",
]

local = [
    "sentence-transformers>=2.0.0",
    "ctransformers>=0.2"
]

# Individual database providers
couchbase = ["couchbase>=4.2.1"]
cassandra = ["cassio>=0.1.7"]
clickhouse = ["clickhouse-connect==0.7.19"]


mongodb = ["pymongo>=4.10.1"]
