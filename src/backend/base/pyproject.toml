# Data processing
datasets = ["datasets>2.14.7,<5.0.0"]
fastparquet = ["fastparquet>=2024.11.0,<2025.0.0"]

# Vision / ML
vlmrun = ["vlmrun[all]>=0.2.0"]
cuga = [
